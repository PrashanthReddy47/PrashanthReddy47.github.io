<style>
/* ============================================
   LAYOUT & SPACING (applies to both modes)
   ============================================ */

/* Hero section padding */
main > section:first-child,
.page-body > section:first-child,
[class*="biography"] {
  padding-top: 1.5rem !important;
  padding-bottom: 1.5rem !important;
}

/* Professional Summary heading */
[class*="biography"] h2,
main > section:first-child h2 {
  margin-top: 0.5rem !important;
  margin-bottom: 0.5rem !important;
  padding-top: 0 !important;
}

/* Container padding */
[class*="biography"] .container,
[class*="biography"] > div {
  padding-top: 0 !important;
  gap: 1rem !important;
}

/* Avatar spacing */
[class*="avatar"],
.rounded-full {
  margin-bottom: 0.75rem !important;
}

/* Section gaps */
main > section,
.page-body > section {
  padding-top: 2.5rem !important;
  padding-bottom: 2.5rem !important;
}

/* Flex gaps */
[class*="flex"][class*="col"] {
  gap: 1rem !important;
}

/* Grid spacing */
[class*="grid"] {
  gap: 1.5rem !important;
}

/* Base typography */
body {
  font-size: 1.125rem;
  line-height: 1.7;
}

/* Hide social share buttons */
[class*="share"],
[class*="social-icon"],
.page-share,
.article-share,
a[href*="twitter.com/intent"],
a[href*="facebook.com/sharer"],
a[href*="linkedin.com/share"],

a[aria-label*="facebook"],
a[title*="Share"],

.article-footer [class*="share"],
.page-footer [class*="share"],

}

.dark body,
html.dark body,
[data-theme="dark"] body {
  background-color: #0f172a;
  color: #e5e7eb;
}

.dark [class*="biography"],
html.dark [class*="biography"],
[data-theme="dark"] [class*="biography"] {

.dark [class*="biography"] h2,

[data-theme="light"] [class*="biography"] div,
[data-theme="light"] [class*="biography"] [class*="card"] {

html:not(.dark) [class*="biography"] [class*="backdrop-blur"],
